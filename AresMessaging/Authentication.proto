syntax = "proto3";

package ares.messages;

import "google/protobuf/timestamp.proto";

service Authentication {
	rpc Authenticate(AuthenticationRequest) returns (AuthenticationResponse);
}

message AuthenticationRequest {
	string user_name = 1; // the username to log in with
	string password = 2; // the password in plain text
}

message AuthenticationResponse {
	Token token = 1; // the token assuming login was successful
	bool success = 2; // whether or not the authentication was successful
	repeated string errors = 3; // if success is false, this field will contain the reasoning for why
}

message Token {
	string token_string = 1; // the JWT string
	google.protobuf.Timestamp expiration = 2; // when the token expires
}